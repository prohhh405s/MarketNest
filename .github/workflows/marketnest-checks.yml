name: MarketNest smoke checks

on:
  pull_request:
  push:
    branches:
      - main
      - feature/private-admin-console

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check features.js
          node --check helpers.js
          node --check admin.js
          node --check tests/run-tests.js
      - name: Run offline smoke checks
        run: node tests/run-tests.js
